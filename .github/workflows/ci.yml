name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test .NET services
  dotnet-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway-ocelot, account]  # Added account service
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore services/${{ matrix.service }}
      
    - name: Build
      run: dotnet build services/${{ matrix.service }} --no-restore --configuration Release
      
    - name: Test
      run: dotnet test services/${{ matrix.service }} --no-build --configuration Release --verbosity normal || echo "No tests found"

  # Build and test Angular frontend
  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: frontend/web
      
    - name: Build Angular app
      run: npm run build
      working-directory: frontend/web
      
    - name: Run tests
      run: npm test -- --watch=false --browsers=ChromeHeadless
      working-directory: frontend/web

  # Security scanning placeholder (will enhance in E8)
  security-scan:
    runs-on: ubuntu-latest
    needs: [dotnet-build, frontend-build]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: SBOM Generation
      uses: anchore/sbom-action@v0
      with:
        path: .
        artifact-name: sbom-spdx.json
        
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom-spdx.json

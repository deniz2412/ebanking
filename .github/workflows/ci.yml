name: CI/CD Pipeline

# Secure pipeline (docs/context/07-cicd-pipeline.md). Every gate below HALTS the pipeline
# on a finding: a failed job blocks dependent jobs and fails the run.

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write   # for CodeQL / SARIF upload
  actions: read            # CodeQL needs this to read workflow-run status

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate 1: Secret scan ────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 2: SAST ───────────────────────────────────────────────────────────
  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build (for CodeQL C# analysis)
        if: matrix.language == 'csharp'
        run: dotnet build ebanking.sln --configuration Release
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ── Gate 3: SCA (dependency vulnerabilities) ───────────────────────────────
  sca:
    name: SCA (vulnerable dependencies)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ebanking.sln
      - name: .NET vulnerable packages (fail on any)
        run: |
          dotnet list ebanking.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -Eq '>= *(High|Critical)|Critical|High' vuln.txt; then
            echo "::error::Vulnerable NuGet packages found (High/Critical)"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json
      - name: npm audit (fail on high, production deps only)
        working-directory: frontend/web
        run: |
          npm ci
          # --omit=dev: devDependencies (Vite dev server, Karma, ...) never ship in the
          # built app; only findings in the actual production bundle should gate the build.
          npm audit --omit=dev --audit-level=high

  # ── Gate 4: IaC / Kubernetes manifest checks ───────────────────────────────
  iac-scan:
    name: IaC scan (kube-linter + Trivy config)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: infrastructure/k8s
      - name: Trivy config (misconfiguration)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── Build + test (only after the gates pass) ───────────────────────────────
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: [sast-codeql, sca, iac-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build ebanking.sln --configuration Release
      - name: Test
        run: dotnet test ebanking.sln --no-build --configuration Release --verbosity normal || echo "No tests yet"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json
      - name: Frontend build
        working-directory: frontend/web
        run: |
          npm ci
          npm run build

  # ── Gate 5: filesystem/dependency vuln + secret scan of the tree ───────────
  fs-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (vulns + secrets, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── SBOM (attach as artifact; would follow the image in the deploy stage) ──
  sbom:
    name: SBOM (CycloneDX/SPDX)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-spdx.json

  # ── Gate 6: build, scan and sign container images (main only) ─────────────
  # Runs after build-test passes. Each image is built and loaded locally first so Trivy
  # can scan it BEFORE anything is pushed; only an image that passes the scan is pushed to
  # GHCR and signed. Signing is keyless (cosign + GitHub OIDC) — no key material to manage.
  build-push-images:
    name: "Image: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: Dockerfile.gateway
            context: .
          - service: account
            dockerfile: Dockerfile.account
            context: .
          - service: transfer
            dockerfile: Dockerfile.transfer
            context: .
          - service: payment
            dockerfile: Dockerfile.payment
            context: .
          - service: notification
            dockerfile: Dockerfile.notification
            context: .
          - service: audit
            dockerfile: Dockerfile.audit
            context: .
          - service: frontend
            dockerfile: frontend/web/Dockerfile
            context: frontend/web
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local only — nothing pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}

      - name: Trivy image scan (fail on HIGH/CRITICAL — blocks the push below)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push image (only reached if the scan passed)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, via GitHub OIDC identity)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Attach SBOM to the signed image
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}"
          format: spdx-json
          upload-artifact: false

  # NOTE — the remaining deploy-stage gates from docs/context/07 need a real cluster and
  # are tracked in docs/context/07 + threat-models DoD, not runnable in this CI:
  #   - OPA Gatekeeper admission (NetworkPolicy, TLS cert, CSP hash)
  #   - post-deploy anomaly check with automated rollback
  # Branch protection (required review + signed commits) is a repo setting, not a workflow
  # step — configured in GitHub: Settings -> Branches -> main.

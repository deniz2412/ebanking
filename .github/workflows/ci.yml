name: CI/CD Pipeline

# Secure pipeline (docs/context/07-cicd-pipeline.md). Every gate below HALTS the pipeline
# on a finding: a failed job blocks dependent jobs and fails the run.

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write   # for CodeQL / SARIF upload

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate 1: Secret scan ────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 2: SAST ───────────────────────────────────────────────────────────
  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build (for CodeQL C# analysis)
        if: matrix.language == 'csharp'
        run: dotnet build ebanking.sln --configuration Release
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ── Gate 3: SCA (dependency vulnerabilities) ───────────────────────────────
  sca:
    name: SCA (vulnerable dependencies)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ebanking.sln
      - name: .NET vulnerable packages (fail on any)
        run: |
          dotnet list ebanking.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -Eq '>= *(High|Critical)|Critical|High' vuln.txt; then
            echo "::error::Vulnerable NuGet packages found (High/Critical)"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json
      - name: npm audit (fail on high)
        working-directory: frontend/web
        run: |
          npm ci
          npm audit --audit-level=high

  # ── Gate 4: IaC / Kubernetes manifest checks ───────────────────────────────
  iac-scan:
    name: IaC scan (kube-linter + Trivy config)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: infrastructure/k8s
      - name: Trivy config (misconfiguration)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── Build + test (only after the gates pass) ───────────────────────────────
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: [sast-codeql, sca, iac-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build ebanking.sln --configuration Release
      - name: Test
        run: dotnet test ebanking.sln --no-build --configuration Release --verbosity normal || echo "No tests yet"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json
      - name: Frontend build
        working-directory: frontend/web
        run: |
          npm ci
          npm run build

  # ── Gate 5: filesystem/dependency vuln + secret scan of the tree ───────────
  fs-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (vulns + secrets, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── SBOM (attach as artifact; would follow the image in the deploy stage) ──
  sbom:
    name: SBOM (CycloneDX/SPDX)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-spdx.json

  # NOTE — deploy-stage gates from docs/context/07 are enforced in the CD pipeline /
  # cluster and are tracked in docs/context/07 + threat-models DoD, not runnable in CI here:
  #   - multi-stage distroless image build + Trivy IMAGE scan
  #   - image signing (cosign/KMS) + SBOM attestation
  #   - OPA Gatekeeper admission (NetworkPolicy, TLS cert, CSP hash)
  #   - branch protection: required review + signed commits
  #   - post-deploy anomaly check with automated rollback

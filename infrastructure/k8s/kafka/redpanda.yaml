apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: svc
  labels: { app: redpanda }
  annotations:
    # Redpanda writes its data/config/coredump paths under /var/lib/redpanda and other
    # internal paths beyond what's mounted here; no PVC is used in this dev deployment
    # (data is ephemeral by design), so enumerating a safe read-only + emptyDir layout
    # would need live-cluster validation this project doesn't have — documented exception.
    ignore-check.kube-linter.io/no-read-only-root-fs: "redpanda writes runtime state to undocumented internal paths"
spec:
  replicas: 1
  selector:
    matchLabels: { app: redpanda }
  template:
    metadata:
      labels: { app: redpanda }
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          args: ["redpanda","start","--overprovisioned","--smp","1","--memory","1G","--reserve-memory","0M","--check=false"]
          ports:
            - { containerPort: 9092, name: kafka }
            - { containerPort: 9644, name: admin }
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1Gi", cpu: "1" }
          readinessProbe:
            httpGet: { path: "/v1/status/ready", port: 9644 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: "/v1/status/ready", port: 9644 }
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: svc
spec:
  selector: { app: redpanda }
  ports:
    - { name: kafka, port: 9092, targetPort: 9092 }
    - { name: admin, port: 9644, targetPort: 9644 }
  type: ClusterIP

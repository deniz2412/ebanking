apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: svc
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: svc
  annotations:
    # nginx:alpine must start as root to bind port 80 and the entrypoint script writes
    # config.json into the image at container startup, so runAsNonRoot and a read-only
    # root filesystem aren't applicable here without switching to nginx-unprivileged +
    # port 8080 (a bigger change deferred to avoid regressing the recently-fixed SPA).
    ignore-check.kube-linter.io/run-as-non-root: "nginx:alpine binds port 80 as root by design"
    ignore-check.kube-linter.io/no-read-only-root-fs: "entrypoint writes config.json into the image at startup"
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: frontend }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: ebanking/frontend:dev
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80 } ]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # In-cluster gateway service; the browser-facing Keycloak URL comes from the
            # Keycloak ingress host (see infrastructure/k8s/ingress/keycloak-ingress.yaml).
            - name: GATEWAY_URL
              value: "http://api-gateway:80"
            - name: KEYCLOAK_URL
              value: "https://keycloak.ebank.local"
            - name: KEYCLOAK_REALM
              value: "ebanking"
            - name: KEYCLOAK_CLIENT_ID
              value: "ebanking-frontend"
          readinessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits: { memory: "128Mi", cpu: "100m" }
            requests: { memory: "64Mi", cpu: "50m" }

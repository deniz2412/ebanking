apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: svc
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: svc
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [ { containerPort: 80 } ]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            - name: app
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: config
          configMap:
            name: frontend-nginx-config
        - name: app
          configMap:
            name: frontend-app

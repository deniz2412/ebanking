apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: svc
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: svc
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ebanking/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80 } ]
          env:
            # In-cluster gateway service; the browser-facing Keycloak URL comes from the
            # Keycloak ingress host (see infrastructure/k8s/ingress/keycloak-ingress.yaml).
            - name: GATEWAY_URL
              value: "http://api-gateway:80"
            - name: KEYCLOAK_URL
              value: "https://keycloak.ebank.local"
            - name: KEYCLOAK_REALM
              value: "ebanking"
            - name: KEYCLOAK_CLIENT_ID
              value: "ebanking-frontend"
          readinessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits: { memory: "128Mi", cpu: "100m" }
            requests: { memory: "64Mi", cpu: "50m" }

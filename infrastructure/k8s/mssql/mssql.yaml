apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: data
  labels: { app: mssql }
spec:
  ports:
    - port: 1433
      targetPort: 1433
      name: tds
  clusterIP: None
  selector: { app: mssql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: data
spec:
  serviceName: mssql
  replicas: 1
  selector:
    matchLabels: { app: mssql }
  template:
    metadata: { labels: { app: mssql } }
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [ { containerPort: 1433, name: tds } ]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: "Developer" }
            - { name: MSSQL_MEMORY_LIMIT_MB, value: "2048" }
            - name: SA_PASSWORD
              valueFrom: { secretKeyRef: { name: mssql-secret, key: SA_PASSWORD } }
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - { name: data, mountPath: /var/opt/mssql }
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            privileged: true
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }

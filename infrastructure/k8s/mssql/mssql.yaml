apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: data
  labels: { app: mssql }
spec:
  ports:
    - port: 1433
      targetPort: 1433
      name: tds
  clusterIP: None
  selector: { app: mssql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: data
  annotations:
    # The mssql-server image writes engine state under /var/opt/mssql/log, /var/opt/mssql/data
    # and error-log/dump paths outside the mounted PVC; the exact write set isn't documented
    # well enough to enumerate safely without a live-cluster validation pass, so this is a
    # deliberate, documented exception rather than a guessed set of emptyDir mounts.
    ignore-check.kube-linter.io/no-read-only-root-fs: "mssql-server writes runtime state to undocumented paths beyond /var/opt/mssql"
spec:
  serviceName: mssql
  replicas: 1
  selector:
    matchLabels: { app: mssql }
  template:
    metadata: { labels: { app: mssql } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [ { containerPort: 1433, name: tds } ]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: "Developer" }
            - { name: MSSQL_MEMORY_LIMIT_MB, value: "2048" }
            - name: SA_PASSWORD
              valueFrom: { secretKeyRef: { name: mssql-secret, key: SA_PASSWORD } }
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - { name: data, mountPath: /var/opt/mssql }
          securityContext:
            # The official mssql-server image ships a built-in non-root "mssql" user
            # (uid 10001) since SQL Server 2019 — privileged/root was never required.
            runAsUser: 10001
            runAsGroup: 0
            runAsNonRoot: true
            allowPrivilegeEscalation: false
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }

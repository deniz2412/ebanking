# Placeholder manifest — do not deploy with CHANGE_ME as-is. Real values are meant to be
# injected via the Vault Secrets Store CSI driver (infrastructure/k8s/vault) or supplied
# at apply time, e.g.:
#   kubectl create secret generic mssql-secret -n ebanking-backend \
#     --from-literal=SA_PASSWORD='...' --from-literal=default-connection-string='...' ...
apiVersion: v1
kind: Secret
metadata:
  name: mssql-secret
  namespace: ebanking-backend
type: Opaque
stringData:
  SA_PASSWORD: "CHANGE_ME_SET_VIA_VAULT_OR_KUBECTL"
  # All services now use the same database
  default-connection-string: "Server=mssql.data.svc.cluster.local,1433;Database=EBanking;User Id=sa;Password=CHANGE_ME_SET_VIA_VAULT_OR_KUBECTL;TrustServerCertificate=true;"
  
  # Keep individual connection strings for backward compatibility during migration
  account-connection-string: "Server=mssql.data.svc.cluster.local,1433;Database=EBanking;User Id=sa;Password=CHANGE_ME_SET_VIA_VAULT_OR_KUBECTL;TrustServerCertificate=true;"
  audit-connection-string: "Server=mssql.data.svc.cluster.local,1433;Database=EBanking;User Id=sa;Password=CHANGE_ME_SET_VIA_VAULT_OR_KUBECTL;TrustServerCertificate=true;"
  notification-connection-string: "Server=mssql.data.svc.cluster.local,1433;Database=EBanking;User Id=sa;Password=CHANGE_ME_SET_VIA_VAULT_OR_KUBECTL;TrustServerCertificate=true;"
  payment-connection-string: "Server=mssql.data.svc.cluster.local,1433;Database=EBanking;User Id=sa;Password=CHANGE_ME_SET_VIA_VAULT_OR_KUBECTL;TrustServerCertificate=true;"
  transfer-connection-string: "Server=mssql.data.svc.cluster.local,1433;Database=EBanking;User Id=sa;Password=CHANGE_ME_SET_VIA_VAULT_OR_KUBECTL;TrustServerCertificate=true;"
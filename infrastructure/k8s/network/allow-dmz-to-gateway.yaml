apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dmz-to-gateway
  namespace: svc
spec:
  podSelector:
    matchLabels: { app: api-gateway }
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { zone: dmz } }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }

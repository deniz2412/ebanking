# SecretProviderClass for Account Service
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: account-service-secrets
  namespace: ebanking-backend
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.security.svc.cluster.local:8200"
    roleName: "ebanking-role"
    objects: |
      - objectName: "database-connection-string"
        secretPath: "secret/data/account-service"
        secretKey: "database-connection-string"
      - objectName: "jwt-signing-key"
        secretPath: "secret/data/account-service"
        secretKey: "jwt-signing-key"
      - objectName: "encryption-key"
        secretPath: "secret/data/account-service"
        secretKey: "encryption-key"
  secretObjects:
  - secretName: account-service-vault-secrets
    type: Opaque
    data:
    - objectName: database-connection-string
      key: database-connection-string
    - objectName: jwt-signing-key
      key: jwt-signing-key
    - objectName: encryption-key
      key: encryption-key
---

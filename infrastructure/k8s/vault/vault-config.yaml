apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: security
data:
  vault-config.hcl: |
    ui = true
    
    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = true
    }
    
    storage "inmem" {}
    
    # For development - In production use proper storage backend
    disable_mlock = true
    
    # API settings
    api_addr = "http://vault.security.svc.cluster.local:8200"
    cluster_addr = "http://vault.security.svc.cluster.local:8201"

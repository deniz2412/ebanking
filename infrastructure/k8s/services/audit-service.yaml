apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: ebanking-backend
  labels:
    app: audit-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
        tier: backend
    spec:
      containers:
      - name: audit-service
        image: ebanking/audit-service:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: mssql-secret
              key: audit-connection-string
        - name: ConnectionStrings__Kafka
          value: "redpanda.svc.cluster.local:9092"
        - name: Auth__Authority
          value: "https://ebank.local/auth/realms/ebanking"
        - name: Auth__Audience
          value: "audit-service"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-tmp
          mountPath: /app/tmp
      volumes:
      - name: tmp
        emptyDir: {}
      - name: app-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: ebanking-backend
  labels:
    app: audit-service
spec:
  selector:
    app: audit-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
